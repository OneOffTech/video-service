name: Tests

on: 
  push:
    branches: 
      - "main"
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  phpunit:
    name: Tests PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    container: 
      image: klinktechnology/k-box-ci-pipeline-php:${{ matrix.php }}
      options: --user root 
    
    services:
      mariadb:
        image: mariadb:11.8.9
        env:
          MYSQL_DATABASE: laravel
          MYSQL_USER: sail
          MYSQL_ROOT_PASSWORD: "password"
          MYSQL_PASSWORD: "password"
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3

    strategy:
      fail-fast: true
      matrix:
        php: [8.4]

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0
      with:
        fetch-depth: 1

    - name: Cache PHP dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1
      with:
        path: ~/.composer/cache/files
        key: dependencies-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}

    - name: Cache JS dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1
      with:
        path: ~/.npm/
        key: dependencies-js-${{ hashFiles('package-lock.json') }}

    - name: Install FFmpeg
      uses: Iamshankhadeep/setup-ffmpeg@ffmpeg-5.0-20220119
      with:
        version: 5.0
      id: setup-ffmpeg
      
    - name: Install dependencies
      run: |
        cp .env.example .env
        composer install --prefer-dist
        npm ci
        npm run build

    - name: Run tests
      run: |
        php artisan key:generate
        php artisan view:clear
        php artisan config:clear
        php artisan route:clear
        ./vendor/bin/phpunit --stop-on-error --stop-on-failure
      env:
        FFMPEG_TEMPORARY_FILES_ROOT: ${{ github.workspace }}
        DB_HOST: mariadb
        DB_USERNAME: sail
        DB_PASSWORD: password
    